[package]
name = "zod-source-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_asset",
    "bevy_audio",
    "bevy_core_pipeline",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_window",
    "bevy_winit",
    "bmp",
    "png",
    "std",
    "wav",
    "webgl2",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pathfinding = "4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
